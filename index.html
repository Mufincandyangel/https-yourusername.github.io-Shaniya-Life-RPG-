<!DOCTYPE html>
<html>
<head>
<title>Life RPG 🌸</title>
<link rel="stylesheet" href="style.css">
</head>

<body><div class="floating">🎀</div>
<div class="floating">🌸</div>
<div class="floating">💖</div>
<div class="floating">✨</div>

<div class="container">
<div class="welcome">
  <div id="dashboard" class="dashboard" style="display:none;">

<h1 id="styleTitle">🌸 My Life RPG</h1>

<div class="stats">

<div class="card">
<h2>⭐ Level</h2>
<p id="level">1</p>
</div>

<div class="card">
<h2>💗 XP</h2>
<p id="xp">0 / 100</p>
</div>

<div class="card">
<h2>🪙 Coins</h2>
<p id="coins">0</p>
</div>

</div>

<div class="xpBar">
<div id="xpFill"></div>
</div>

<h2>Today's Tasks</h2>

<div class="task-box">

<input
id="taskInput"
placeholder="Add a cute task..."
>

<button onclick="addTask()">
➕
</button>

</div>

<div id="taskList"></div>

</div>

<h1>🌸 Life RPG 🌸</h1>

<h2>Choose your aesthetic</h2>

<div class="choices">

<button onclick="selectStyle('Gyaru Princess')">
🎀<br>
Gyaru Princess
</button>


<button onclick="selectStyle('Kawaii')">
🌸<br>
Kawaii
</button>


<button onclick="selectStyle('Dark Gyaru')">
🖤<br>
Dark Gyaru
</button>


<button onclick="selectStyle('Victorian')">
🌹<br>
Victorian
</button>


<button onclick="selectStyle('Y2K')">
💿<br>
Y2K
</button>

</div>


<p id="selected">
Choose your style 💗
</p>


<button class="start" onclick="startGame()">
✨ Start Game ✨
</button>


</div>


<script src="script.js"></script>

</body>
</html>
