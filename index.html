<!DOCTYPE html>
<html>

<head>
    <title>🌸 Life RPG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<h1>🌸 Life RPG 🌸</h1>

<div id="creator">

<h2>✨ Create Your Character ✨</h2>

<input id="name" placeholder="Your name">

<h3>Choose your aesthetic:</h3>

<button onclick="chooseStyle('gyaru')">
🎀 Gyaru Princess
</button>

<button onclick="chooseStyle('kawaii')">
🌸 Kawaii Sakura
</button>

<button onclick="chooseStyle('dark')">
🖤 Dark Academia
</button>

<button onclick="chooseStyle('berry')">
🍓 Strawberry Dream
</button>

</div>


<div id="game" style="display:none;">

<h2>
✨ <span id="playerName"></span> ✨
</h2>

<p>
Style:
<span id="style"></span>
</p>


<h3>
Level <span id="level">1</span>
</h3>


<div class="xp-box">
<div id="xp-bar"></div>
</div>


<p>
XP:
<span id="xp">0</span>/100
</p>


<p>
💰 Coins:
<span id="coins">0</span>
</p>


<h2>📜 Quests</h2>


<button onclick="completeQuest(10)">
💧 Drink Water +10 XP
</button>

<button onclick="completeQuest(20)">
📚 Study +20 XP
</button>

<button onclick="completeQuest(15)">
🧴 Skincare +15 XP
</button>


</div>

</div>


<script src="script.js"></script>

</body>

</html>
